[project]
name = "django-core"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1",
    "boto3>=1.40",
    "celery[redis]>=5.5",
    "django>=5.2,<5.3",
    "django-allauth[socialaccount]>=65.10",
    "django-filter>=25.2",
    "django-redis>=6.0",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "drf-spectacular>=0.28",
    "gunicorn>=23",
    "pillow>=11",
    "pydantic>=2.11",
    "psycopg[binary]>=3.2",
    "python-decouple>=3.8",
    "redis>=6",
    "sentry-sdk[django]>=2.40",
    "whitenoise[brotli]>=6.9",
    "ddtrace>=3.10",
]

[tool.ruff.lint.per-file-ignores]
"apps/ingest/models.py" = ["RUF012"]
"apps/ingest/admin.py" = ["RUF012"]
"apps/ingest/migrations/*.py" = ["RUF012", "I001"]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "faker>=37",
    "hypothesis>=6.140",
    "mypy>=1.17",
    "django-stubs[compatible-mypy]>=5.2",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.12",
]
