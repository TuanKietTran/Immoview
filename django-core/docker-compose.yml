services:
  db:
    # PostGIS currently publishes no native arm64 image; emulate amd64 on Apple Silicon.
    platform: linux/amd64
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: realestate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate -d realestate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run python manage.py collectstatic --noinput &&
             uv run ddtrace-run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - media_data:/app/media
      - staticfiles_data:/app/staticfiles
    environment:
      SECRET_KEY: dev-secret-key-change-in-prod
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      DB_HOST: db
      DB_NAME: realestate
      DB_USER: realestate
      DB_PASSWORD: realestate
      REDIS_URL: redis://redis:6379/0
      # LocalStack / AWS (fake creds for local)
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-central-1
      SQS_LEAD_SCORING_URL: http://localstack:4566/000000000000/lead-scoring
      SNS_LEAD_CREATED_ARN: arn:aws:sns:eu-central-1:000000000000:lead-created
      SNS_PHOTO_READY_ARN: arn:aws:sns:eu-central-1:000000000000:listing-photo-ready
      S3_LISTINGS_RAW: listings-raw
      S3_LISTINGS_CDN: listings-cdn
      DYNAMODB_LEAD_SCORES_TABLE: lead-scores
      # Observability — disabled by default for local dev; set to "true" to enable APM
      DD_TRACE_ENABLED: "false"
      DD_SERVICE: django-core
      DD_ENV: development
      DD_VERSION: "1.0.0"
      DD_DOGSTATSD_HOST: datadog-agent
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      - "8000"

  worker:
    build: .
    command: uv run celery -A config.celery_app worker --loglevel=INFO --concurrency=2
    volumes:
      - .:/app
    environment:
      SECRET_KEY: dev-secret-key-change-in-prod
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      DB_HOST: db
      DB_NAME: realestate
      DB_USER: realestate
      DB_PASSWORD: realestate
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: uv run celery -A config.celery_app beat --loglevel=INFO
    volumes:
      - .:/app
    environment:
      SECRET_KEY: dev-secret-key-change-in-prod
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      DB_HOST: db
      DB_NAME: realestate
      DB_USER: realestate
      DB_PASSWORD: realestate
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - staticfiles_data:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3.4
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,sns,dynamodb,lambda,iam,logs
      DEBUG: "0"
      LAMBDA_EXECUTOR: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      LOCALSTACK_HOST: localstack
      AWS_DEFAULT_REGION: eu-central-1
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ../serverless-aws/localstack-init:/etc/localstack/init/ready.d:ro
      - ../serverless-aws/services:/app/services:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Datadog agent — opt-in via: docker compose --profile observability up
  # Requires DD_API_KEY env var. Site: datadoghq.eu for Swiss data residency.
  datadog-agent:
    profiles: ["observability"]
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.eu}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
      DD_PROCESS_AGENT_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    ports:
      - "8125:8125/udp"
      - "8126:8126"
    healthcheck:
      test: ["CMD", "agent", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  media_data:
  staticfiles_data:
  localstack_data:
